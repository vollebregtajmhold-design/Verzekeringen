<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verzekeringen overzicht</title>
<style>
:root{
  --top:#5a2d82; --topline:#7d55a3; --bar:#f3ede2; --bg:#6b737a;
  --card:#f4efe6; --ink:#1a1a1a; --muted:#555; --line:#a9a9a9; --head:#b9b9b9;
  --mint:#d4e8dc; --blue:#1f5fc4; --green:#2e6b47; --lime:#6aae3d; --pink:#e5007e;
  --hl:#dbeafe; --red:#d62828; --redsoft:#fde3e3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,"Helvetica Neue",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--top);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .dot{width:16px;height:16px;border-radius:50%;background:var(--pink);border:2px solid #fff}
h1{margin:0;font-size:20px;color:#fff;font-weight:700}
.sub{color:#e8ecef;font-size:12px;font-weight:400;text-align:center;margin-top:10px}
.user{margin-left:auto}
#user[hidden]+#fsBtn,.versie+#fsBtn{margin-left:auto}
nav{position:sticky;top:0;z-index:5;background:var(--top);border-top:1px solid var(--topline);box-shadow:0 2px 6px rgba(0,0,0,.25)}
nav .in{max-width:1200px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
nav button{font:inherit;font-weight:700;font-size:16px;padding:8px 22px;cursor:pointer;white-space:nowrap;
  background:var(--mint);color:var(--ink);border:2px solid #fff;border-radius:8px}
nav button:hover{filter:brightness(.96)}
nav button.on{background:var(--blue);color:#fff}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
section{display:none} section.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-top:5px solid var(--blue);border-bottom:5px solid var(--pink);border-left:4px solid var(--lime);border-radius:4px;padding:14px 16px;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.kpi .l{color:var(--muted);font-size:13px;font-weight:400}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.card{background:var(--card);border-top:5px solid var(--blue);border-bottom:5px solid var(--pink);border-left:4px solid var(--lime);border-right:4px solid var(--lime);border-radius:4px;padding:16px;margin-bottom:18px;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.card h2{font-size:14px;margin:0 0 14px;font-weight:700;color:#7a3e10;text-transform:uppercase;letter-spacing:.08em}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;background:var(--bar);padding:10px;border-radius:4px}
input[type=search],select{font:inherit;padding:6px 10px;border:1px solid #999;border-radius:6px;background:#fff;color:var(--ink)}
select{background:var(--green);color:#fff;font-weight:700;font-size:14px;border:1px solid #1d4a30}
input[type=search]{flex:1;min-width:180px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border:1px solid var(--line);vertical-align:top}
td{font-weight:400;color:#222}
th{background:var(--head);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;user-select:none;white-space:nowrap}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover td{background:var(--hl)}
tr.grp td{background:var(--head);font-weight:700;color:var(--ink)}
tfoot td{font-weight:700;background:var(--hl)}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700}
.ja{background:#dcefe3;color:var(--green)}
.nee{background:#e6e6e6;color:#555}
.act{border:2px solid var(--red);color:var(--red);background:#fff}
.muted{color:#777;font-weight:400}
.bars .row{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;margin:6px 0;font-size:14px;font-weight:400}
.bars .bar{height:16px;background:var(--green);border-radius:3px}
.tl{border-left:4px solid var(--lime);padding-left:16px;margin-left:6px}
.tl .d{font-weight:700;margin-top:6px;display:inline-block;background:var(--hl);padding:2px 8px;border-radius:4px}
.tl ul{margin:6px 0 18px;padding-left:18px}
.tl li{margin:4px 0;font-weight:400}
.note{font-size:13px;color:var(--muted)}
a.doc{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 9px;border-radius:6px;font-size:12px;font-weight:700;color:#fff;background:var(--blue);text-decoration:none;white-space:nowrap}
a.doc:hover{filter:brightness(1.15)}
.links li{margin:6px 0;font-weight:400}
@media (max-width:600px){ .bars .row{grid-template-columns:100px 1fr 90px} nav button{font-size:14px;padding:7px 14px} }
@media print{ nav,.tools{display:none} section{display:block!important;page-break-after:always} body{background:#fff} }
#login{max-width:440px;margin:80px auto;text-align:center}
#login p{font-weight:400;color:#555}
.btn{font:inherit;font-weight:700;font-size:16px;padding:10px 22px;cursor:pointer;background:var(--mint);color:var(--ink);border:2px solid #fff;border-radius:8px}
.btn.blue{background:var(--blue);color:#fff}
.user{display:flex;gap:8px;align-items:center;color:#fff;font-size:13px;font-weight:400}
.user .btn{font-size:13px;padding:4px 12px}
.msg{color:var(--red);font-weight:700}
[hidden]{display:none!important}
.versie{background:var(--pink);color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.fs{font:inherit;font-weight:700;font-size:13px;padding:4px 12px;cursor:pointer;background:var(--mint);color:var(--ink);border:2px solid #fff;border-radius:8px}
.add{font-size:13px;padding:5px 12px;background:var(--green);color:#fff}
body:not(.edit) .add, body:not(.edit) .eb{display:none!important}
.eb{white-space:nowrap}
.eb button{font-size:14px;cursor:pointer;background:#fff;border:1px solid #999;border-radius:6px;padding:1px 6px;margin-right:3px}
.eb button:hover{background:var(--hl)}
body.edit #editBtn{background:var(--pink);color:#fff}
.card h2 .add{float:right;text-transform:none;letter-spacing:0}
dialog{border:0;border-top:5px solid var(--blue);border-bottom:5px solid var(--pink);border-radius:6px;padding:20px;background:var(--card);width:min(560px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 12px;color:var(--ink);font-weight:700;font-size:20px}
dialog label{display:block;font-weight:700;font-size:13px;color:#444;margin:8px 0 3px}
dialog input,dialog select,dialog textarea{width:100%;font:inherit;padding:7px 9px;border:1px solid #999;border-radius:6px;background:#fff;color:var(--ink)}
dialog select{background:#fff;color:var(--ink);font-weight:400}
dialog textarea{min-height:140px}
dialog .knoppen{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
dialog .btn{font-size:14px;padding:7px 16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-weight:700;padding:10px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:50}
.herstel{cursor:pointer;text-decoration:underline;opacity:.8}
.herstel:hover{opacity:1}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ck{background:var(--card);border-left:5px solid var(--lime);border-radius:6px;padding:14px 16px;box-shadow:0 6px 14px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:6px}
.ck h3{margin:0;font-size:17px;font-weight:700}
.ck .rol{color:#777;font-size:13px;margin-top:-4px}
.ck a.r1{display:flex;gap:8px;align-items:center;color:var(--blue);text-decoration:none;font-size:14px;word-break:break-all}
.ck a.r1:hover{text-decoration:underline}
.ck .pol{font-size:12px;color:#7a3e10;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.ck .opm{font-size:13px;color:#555;white-space:pre-line}
.ck .eb{margin-top:4px}
a.mij{color:inherit;text-decoration:underline dotted;cursor:pointer}
.leeg{background:var(--card);border-radius:6px;padding:20px;color:#555}
table.piv td.r,table.piv th.r{min-width:90px}
table.piv td.nul{color:#bbb;text-align:center}
table.piv tr.tot td,table.piv td.tot{font-weight:700;background:var(--hl)}
tr.tog{cursor:pointer;user-select:none}
tr.tog:hover td{background:#a9a9a9}
tr.tog .pijl{display:inline-block;width:18px;color:var(--green)}
tr.tog .aantal{font-weight:400;color:#555;margin-left:6px}
.btn.klein{font-size:12px;padding:3px 10px;text-transform:none;letter-spacing:0}
#tZ{table-layout:fixed}
#tZ td{overflow-wrap:anywhere}
#tZ tr.lvl1 td{background:#a3a3a3;font-size:15px}
#tZ tr.lvl1:hover td{background:#959595}
#tZ tr.lvl2 td{background:#d3d3d3}
#tZ tr.lvl2:hover td{background:#c4c4c4}
#tZ tr.lvl2 td:first-child{padding-left:30px}
#tZ tr.lvl3 td:first-child{padding-left:50px}
table.piv td.klik{cursor:pointer}
table.piv td.klik:hover{background:var(--blue)!important;color:#fff}
dialog.breed{width:min(820px,96vw);max-height:88vh}
#infoInhoud{max-height:62vh;overflow:auto}
table.info{font-size:14px}
table.info td,table.info th{padding:5px 10px}
table.info tr.itog{cursor:pointer;user-select:none}
table.info tr.itog .pijl{display:inline-block;width:18px;color:var(--green)}
table.info tr.itog .aantal{font-weight:400;color:#555;margin-left:6px}
table.info tr.i1 td{background:#a3a3a3;font-weight:700}
table.info tr.i1:hover td{background:#959595}
table.info tr.i2 td{background:#d3d3d3;font-weight:700}
table.info tr.i2:hover td{background:#c4c4c4}
table.info tr.i2 td:first-child{padding-left:28px}
table.info tr.i3 td:first-child{padding-left:48px}
table.info .aantal{font-weight:400;color:#555}
.schakel{float:right;display:inline-flex;border:2px solid var(--green);border-radius:8px;overflow:hidden;text-transform:none;letter-spacing:0}
.schakel button{font:inherit;font-size:13px;font-weight:700;padding:4px 12px;border:0;background:#fff;color:var(--green);cursor:pointer}
.schakel button.on{background:var(--green);color:#fff}
table.piv .hoev{font-size:12px;color:#666;font-weight:400}
table.piv td.klik:hover .hoev{color:#e8eefc}
table.info tr.objklik{cursor:pointer}
table.info tr.objklik:hover td{background:var(--hl)}
table.info tr.i2.hl td{background:#b9d3f7}
table.piv td.ptog{cursor:pointer;user-select:none;font-weight:700}
table.piv td.ptog:hover{background:var(--hl)}
table.piv td.ptog .pijl{display:inline-block;width:18px;color:var(--green)}
table.piv td.ptog .aantal{font-weight:400;color:#777}
table.piv tr.pobj td{background:#faf8f3;font-size:13px}
table.piv tr.pobj td:first-child{padding-left:34px;color:#333}
table.piv tr.pobj td.tot{background:#eaf1fd}
#dlgInfo .knoppen{flex-wrap:wrap}
table.piv th.hkop{cursor:pointer;user-select:none}
table.piv th.hkop:hover{background:#a3a3a3}
table.piv th.hkop .pijl{color:var(--green);margin-right:6px;font-size:12px}
table.piv th.hkop.open{text-align:center;background:#9fb9a8;border-bottom:2px solid var(--green)}
table.piv th.asub{font-size:13px;background:#d6e3da;color:var(--ink)}
table.piv td.ptog,table.piv tr.pobj td:first-child{white-space:nowrap}
table.piv td,table.piv th{padding:6px 9px}
table.piv td.r,table.piv th.r{min-width:76px}
table.piv .ltot{background:#e9f0eb;font-weight:700}
table.piv th.ltot{background:#c4d8ca}
.wl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wl a.doc{margin-left:auto;flex-shrink:0}
</style>

<link rel="apple-touch-icon" href="icon-180.png">

<body>
<header>
  <span class="dot"></span>
  <h1>Verzekeringen overzicht</h1>
  <span class="versie" title="Versie">v1.25</span>
  <div class="user" id="user" hidden>
    <button class="btn" id="editBtn" hidden title="Wijzigen, toevoegen en verwijderen aan/uit">✏️ Bewerken</button>
    <button class="btn" id="expBtn" hidden title="Alle gegevens downloaden als back-up">⬇ Back-up</button>
    <button class="btn" id="uit">Uitloggen</button>
  </div>
  <button class="fs" id="fsBtn" title="Volledig scherm aan/uit">⛶ Volledig scherm</button>
</header>
<script>
(function(){
  const b=document.getElementById('fsBtn');
  const zet=()=>{b.textContent=document.fullscreenElement?'✕ Terug':'⛶ Volledig scherm'};
  b.onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); };
  document.addEventListener('fullscreenchange',zet);
  if(!document.documentElement.requestFullscreen) b.hidden=true;
})();
</script>
<div id="login" class="card">
  <h2>Inloggen</h2>
  <p id="loginTekst">Log in met je Google-account om het overzicht te zien.</p>
  <button class="btn blue" id="in">Inloggen met Google</button>
  <p class="msg" id="fout"></p>
</div>
<div id="app" hidden>
<nav><div class="in">
  <button data-t="home" class="on">Overzicht</button>
  <button data-t="bedrijf">Zakelijk</button>
  <button data-t="prive">Privé</button>
  <button data-t="bez">Kassen</button>
  <button data-t="tijd">Aandachtspunten</button>
  <button data-t="contact">Contacten</button>
</div></nav>
<main>
  <section id="home" class="on">
    <div class="kpis" id="kpis"></div>
    <div class="card"><h2>Premie per maatschappij (per jaar)</h2><div class="bars" id="barsMij"></div></div>
    <div class="card"><h2>Verzekerde waarde per locatie</h2><div class="bars" id="barsLoc"></div></div>
    <div class="card"><h2>Actie nodig</h2><div class="tw"><table id="actie"></table></div></div>
  </section>

  <section id="bedrijf">
    <div class="tools">
      <input type="search" id="qB" placeholder="Zoek op naam, maatschappij of polisnummer…">
      <select id="fB"><option value="">Alle categorieën</option></select>
      <select id="aB"><option value="">Actie: alles</option><option value="ja">Alleen actie nodig</option></select>
      <button class="btn add" data-add="bedrijf">+ Toevoegen</button>
    </div>
    <div class="card tw"><table id="tB"></table></div>
  </section>

  <section id="prive">
    <div class="tools"><input type="search" id="qP" placeholder="Zoek…"><button class="btn add" data-add="prive">+ Toevoegen</button></div>
    <div class="card tw"><table id="tP"></table></div>
    <div class="card"><h2>Notities <button class="btn add" data-add="priveNotes">+ Toevoegen</button></h2><ul id="notes"></ul></div>
  </section>

  <section id="bez">
    <div class="tools">
      <input type="search" id="qZ" placeholder="Zoek object…">
      <select id="lZ"><option value="">Alle locaties</option></select>
      <select id="aZ"><option value="">Alle afdelingen</option></select>
      <select id="sZ"><option value="">Alle soorten</option></select>
      <button class="btn add" data-add="bez">+ Toevoegen</button>
    </div>
    <div class="card tw"><h2><span id="pZt">Totaal per soort en afdeling</span> <span style="float:right"><span id="pivMode" class="schakel" style="float:none;margin-right:8px"><button type="button" data-m="waarde">Waarde</button><button type="button" data-m="prijs">Stuksprijs</button><button type="button" data-m="aantal">Aantal</button></span><button type="button" class="btn klein" id="pivOpen">▼ Alles open</button> <button type="button" class="btn klein" id="pivDicht">▶ Alles dicht</button></span></h2><table id="pZ" class="piv"></table></div>
    <div class="card tw" hidden><h2>Alle objecten <span style="float:right"><button class="btn klein" id="zOpen">▼ Alles open</button> <button class="btn klein" id="zDicht">▶ Alles dicht</button></span></h2><table id="tZ"></table></div>
  </section>

  <section id="contact">
    <div class="tools">
      <input type="search" id="qC" placeholder="Zoek op naam, maatschappij, e-mail of telefoon…">
      <button class="btn add" data-add="contacten">+ Contact toevoegen</button>
      <button class="btn add" id="seedC" title="Maak voor elke maatschappij uit je polissen een contactkaart">+ Maatschappijen uit polissen</button>
    </div>
    <div class="cgrid" id="cgrid"></div>
  </section>

  <section id="tijd">
    <div class="card"><h2>Tijdlijn en aandachtspunten <button class="btn add" data-add="tijd">+ Overleg toevoegen</button></h2><div class="tl" id="tl"></div></div>
    <div class="card"><h2>Overige links <button class="btn add" data-add="extra">+ Toevoegen</button></h2><ul class="links" id="extra"></ul></div>
  </section>
  <div class="sub" id="bron"></div>
  <div class="sub"><label id="upBtn" hidden class="herstel" title="Alle gegevens vervangen door een back-up">Back-up terugzetten<input type="file" id="upFile" accept=".json" hidden></label></div>
</main>
</div>
<dialog id="dlg"><form id="frm" method="dialog"><h2 id="dlgTitel"></h2><div id="velden"></div>
<div class="knoppen"><button class="btn" value="annuleer" formnovalidate>Annuleren</button><button class="btn blue" id="opslaan" value="ok">Opslaan</button></div></form></dialog>
<dialog id="dlgInfo" class="breed"><form method="dialog"><h2 id="infoTitel"></h2><div id="infoInhoud" class="tw"></div><div class="knoppen"><span id="infoKnop" class="schakel" style="float:none"><button type="button" data-m="afd">Per afdeling</button><button type="button" data-m="obj">Per object</button></span><button type="button" class="btn klein" id="infoOpen">▼ Alles open</button><button type="button" class="btn klein" id="infoDicht">▶ Alles dicht</button><button type="button" class="btn add" id="infoAdd" hidden>+ Object toevoegen</button><span style="flex:1"></span><button class="btn blue">Sluiten</button></div></form></dialog>
<div id="toast" hidden></div>

<script type="module">
import { firebaseConfig, beheerders } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, writeBatch, runTransaction } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const KEYS = ['bedrijf','prive','priveNotes','bez','tijd','extra','contacten'];
const $ = id => document.getElementById(id);
let D = null, USER = null, EDIT = false, BEHEER = false;

// ---------- hulpjes ----------
const eur = n => n==null ? '' : '€ ' + n.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur0 = n => '€ ' + Math.round(n||0).toLocaleString('nl-NL');
const nf = n => n==null ? '' : n.toLocaleString('nl-NL',{maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag = v => v==='ja' ? '<span class="tag ja">Ja</span>' : v==='nee' ? '<span class="tag nee">Nee</span>' : '<span class="muted">–</span>';
const act = v => v==='ja' ? '<span class="tag act">Actie</span>' : v==='nee' ? '<span class="muted">Nee</span>' : '<span class="muted">–</span>';
const lk = (u,t='Document') => u ? `<a class="doc" href="${esc(u)}" target="_blank" rel="noopener">📄 ${t}</a>` : '';
const sum = (a,f) => a.reduce((t,x)=>t+(f(x)||0),0);
const eb = (sec,id) => `<span class="eb"><button type="button" data-edit="${sec}" data-id="${esc(id)}" title="Wijzigen">✏️</button><button type="button" data-del="${sec}" data-id="${esc(id)}" title="Verwijderen">🗑️</button></span>`;
const withIds = (items, sec) => (items||[]).map((x,i) => x.id ? x : {...x, id: sec+'-'+i});
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(36).slice(2));
const locName = l => /^\d+$/.test(l) ? 'Legmeerdijk '+l : l;
function toast(t){ const e=$('toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>e.hidden=true,2500); }
function fillSelect(id, values, label=v=>v){
  const s=$(id), keep=s.value;
  while(s.options.length>1) s.remove(1);
  values.forEach(v=>s.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(label(v))}</option>`));
  if(values.includes(keep)) s.value=keep;
}

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
  try{localStorage.setItem('tab',b.dataset.t)}catch(e){}
});

function drawPolis(id, sec, q, extra){

const colMatch = (id,x) => { if(id==='*') return true; const [t,loc,afd]=id.split('|'); return (x.loc||'?')===loc && (t==='L' || afdNaam(x.afd)===afd); };
const colLabel = id => { if(id==='*') return ''; const [t,loc,afd]=id.split('|'); return t==='L' ? locName(loc) : locName(loc)+' · '+afd; };
function drawPivot(r, l){
  // rijen: soort (klik = objecten eronder)
  // kolommen: locaties (klik = afdelingen horizontaal), of afdelingen bij gekozen locatie
  const zoek = !!$('qZ').value;

  const kanOpen = loc => !(afdsVan(loc).length===1 && afdsVan(loc)[0]==='Algemeen');

  else locs.forEach(loc=>{
    const open = PIVHOPEN.has(loc) && kanOpen(loc);
    if(open){ const a=afdsVan(loc); a.forEach(x=>cols.push({id:'A|'+loc+'|'+x, label:x})); cols.push({id:'L|'+loc, label:'Totaal', ltot:true}); groepen.push({loc, n:a.length+1, open:true}); }
    else { cols.push({id:'L|'+loc, label:locName(loc)}); groepen.push({loc, n:1, open:false}); }
  });
  const mode = PIVMODE, prijsMode = mode==='prijs', aantalMode = mode==='aantal';
  document.querySelectorAll('#pivMode button').forEach(b=>b.classList.toggle('on', b.dataset.m===mode));
  const v = {}, q = {}, pr = {};
  const addQ = (k,x) => { if(x.aantal==null) return; const e=((x.eenh||'').trim()||'stuks').toLowerCase().replace(/^stuk$/,'stuks'); (q[k]=q[k]||{}); q[k][e]=(q[k][e]||0)+x.aantal; };
  r.forEach(x=>{ const s=sOf(x), o=objKey(x), loc=x.loc||'?';
    for(const c of ['*','L|'+loc,'A|'+loc+'|'+afdNaam(x.afd)]){
      for(const k of [s+'|'+c]){ v[k]=(v[k]||0)+(x.waarde||0); addQ(k,x); }
      for(const k of [s+'§'+o+'|'+c]){ v[k]=(v[k]||0)+(x.waarde||0); addQ(k,x); if(x.prijs!=null) (pr[k]=pr[k]||new Set()).add(x.prijs); }
      v['§tot|'+c]=(v['§tot|'+c]||0)+(x.waarde||0);
    } });
  const prTxt = k => { const p=[...(pr[k]||[])].sort((a,b)=>a-b); return !p.length ? '–' : p.length===1 ? eur(p[0]) : `${eur(p[0])} – ${eur(p[p.length-1])}`; };
  const qTxt = (k,alleenEen) => { const e=Object.entries(q[k]||{}); if(!e.length || (alleenEen && e.length>1)) return ''; return e.map(([u,n])=>`${nf(n)} ${esc(u)}`).join(' + '); };
  PIV = { r, l };
  const inhoud = (k,po) => prijsMode ? (po ? prTxt(k) : '') : aantalMode ? qTxt(k, !po) : eur0(v[k]);
  const cel = (k,ps,po,c,cls='') => v[k]!=null ? `<td class="r klik ${cls}" data-ps="${esc(ps)}" data-po="${esc(po)}" data-pc="${esc(c.id||c)}">${inhoud(k,po)}</td>` : `<td class="nul ${cls}">–</td>`;
  const ccls = c => c.ltot ? 'ltot' : '';
  $('pZt').textContent = (prijsMode ? 'Stuksprijs' : aantalMode ? 'Aantal' : 'Totaal') + (l ? ` per soort en afdeling – ${locName(l)}` : ' per soort en locatie');
  if(!r.length){ $('pZ').innerHTML='<tr><td class="muted">Niets gevonden.</td></tr>'; return; }
  let h = '<thead>';
  const tweeRij = !l && groepen.some(g=>g.open);
  if(!l){
    h += `<tr><th${tweeRij?' rowspan="2"':''}>Soort / object</th>` + groepen.map(g => g.open
      ? `<th class="hkop open" colspan="${g.n}" data-loc="${esc(g.loc)}"><span class="pijl">◀</span>${esc(locName(g.loc))}</th>`
      : `<th class="r ${kanOpen(g.loc)?'hkop':''}"${tweeRij?' rowspan="2"':''} data-loc="${esc(g.loc)}">${kanOpen(g.loc)?'<span class="pijl">▶</span>':''}${esc(locName(g.loc))}</th>`).join('') + `<th class="r"${tweeRij?' rowspan="2"':''}>Totaal</th></tr>`;
    if(tweeRij) h += '<tr>' + cols.filter(c=>c.id.startsWith('A|')||c.ltot).map(c=>`<th class="r asub ${ccls(c)}">${esc(c.label)}</th>`).join('') + '</tr>';
  } else h += '<tr><th>Soort / object</th>'+cols.map(c=>`<th class="r">${esc(c.label)}</th>`).join('')+'<th class="r">Totaal</th></tr>';
  h += '</thead><tbody>';
  rows.forEach(s=>{
    const objs = [...new Set(r.filter(x=>sOf(x)===s).map(objKey))].sort((a,b)=>a.localeCompare(b,'nl'));
    const open = PIVOPEN.has(s) || zoek;
    h += `<tr class="psoort"><td class="ptog" data-s="${esc(s)}"><span class="pijl">${open?'▼':'▶'}</span>${esc(s)} <span class="aantal">(${objs.length})</span></td>`+cols.map(c=>cel(s+'|'+c.id,s,'',c,ccls(c))).join('')+cel(s+'|*',s,'','*','tot')+'</tr>';
    if(open) objs.forEach(o=>{
      const naam = (r.find(x=>sOf(x)===s && objKey(x)===o)||{}).obj || objNaam(o);
      h += `<tr class="pobj"><td>${esc(naam)}</td>`+cols.map(c=>cel(s+'§'+o+'|'+c.id,s,o,c,ccls(c))).join('')+cel(s+'§'+o+'|*',s,o,'*','tot')+'</tr>';
    });
  });
  h += (prijsMode||aantalMode) ? '</tbody>' : '</tbody><tfoot><tr class="tot"><td>Totaal</td>'+cols.map(c=>`<td class="r klik ${ccls(c)}" data-ps="*" data-po="" data-pc="${esc(c.id)}">${eur0(v['§tot|'+c.id]||0)}</td>`).join('')+`<td class="r klik" data-ps="*" data-po="" data-pc="*">${eur0(sum(r,x=>x.waarde))}</td></tr></tfoot>`;
  $('pZ').innerHTML = h;
}
$('pZ').addEventListener('click', e=>{
  const k=e.target.closest('th.hkop'); if(k){ const loc=k.dataset.loc; PIVHOPEN.has(loc)?PIVHOPEN.delete(loc):PIVHOPEN.add(loc); drawZ(); return; }
  const t=e.target.closest('td.ptog'); if(!t) return; const s=t.dataset.s; PIVOPEN.has(s)?PIVOPEN.delete(s):PIVOPEN.add(s); drawZ(); });
$('pivOpen').onclick = () => { D.bez.forEach(x=>PIVOPEN.add(x.sub||'Overig')); drawZ(); };
$('pivDicht').onclick = () => { PIVOPEN.clear(); drawZ(); };
document.querySelectorAll('#pivMode button').forEach(b=>b.onclick=()=>{ PIVMODE=b.dataset.m; try{localStorage.setItem('pivmode',PIVMODE)}catch(e){} if(PIVMODE!=='waarde' && !PIVOPEN.size) D.bez.forEach(x=>PIVOPEN.add(x.sub||'Overig')); drawZ(); });

// ---------- contacten ----------
const norm = v => String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const heeftContact = m => m && D.contacten.some(c=>norm(c.org)===norm(m) || norm(c.naam)===norm(m));
const mijLink = m => heeftContact(m) ? `<a class="mij" data-mij="${esc(m)}" title="Bekijk contactgegevens">${esc(m)}</a>` : esc(m);
const webUrl = w => /^https?:\/\//i.test(w) ? w : 'https://'+w;
function drawC(){
  const t = $('qC').value.toLowerCase();
  const r = D.contacten.filter(c=>!t || [c.naam,c.org,c.rol,c.tel,c.mob,c.email,c.web,c.adres,c.opm].join(' ').toLowerCase().includes(t))
    .sort((a,b)=>String(a.org||a.naam).localeCompare(String(b.org||b.naam),'nl'));
  if(!D.contacten.length){ $('cgrid').innerHTML = '<div class="leeg">Nog geen contacten. Klik op <b>✏️ Bewerken</b> en daarna op <b>+ Maatschappijen uit polissen</b> of <b>+ Contact toevoegen</b>.</div>'; return; }
  $('cgrid').innerHTML = r.map(c=>{
    const pol = [...D.bedrijf,...D.prive].filter(x=>x.mij && (norm(x.mij)===norm(c.org)||norm(x.mij)===norm(c.naam))).length;
    return `<div class="ck">
      <h3>${esc(c.naam||c.org)}</h3>
      ${(c.org&&c.naam&&c.org!==c.naam)||c.rol?`<div class="rol">${esc([c.naam&&c.org!==c.naam?c.org:'',c.rol].filter(Boolean).join(' · '))}</div>`:''}
      ${c.tel?`<a class="r1" href="tel:${esc(c.tel.replace(/[^+0-9]/g,''))}">📞 ${esc(c.tel)}</a>`:''}
      ${c.mob?`<a class="r1" href="tel:${esc(c.mob.replace(/[^+0-9]/g,''))}">📱 ${esc(c.mob)}</a>`:''}
      ${c.email?`<a class="r1" href="mailto:${esc(c.email)}">✉️ ${esc(c.email)}</a>`:''}
      ${c.web?`<a class="r1" href="${esc(webUrl(c.web))}" target="_blank" rel="noopener">🌐 ${esc(c.web.replace(/^https?:\/\//,''))}</a>`:''}
      ${c.login?`<a class="r1" href="${esc(webUrl(c.login))}" target="_blank" rel="noopener">🔑 Inloggen klantportaal</a>`:''}
      ${c.adres?`<a class="r1" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.adres)}" target="_blank" rel="noopener">📍 ${esc(c.adres)}</a>`:''}
      ${c.klantnr?`<div class="opm">Klantnummer: ${esc(c.klantnr)}</div>`:''}
      ${c.opm?`<div class="opm">${esc(c.opm)}</div>`:''}
      ${pol?`<div class="pol">${pol} polis${pol>1?'sen':''}</div>`:''}
      ${eb('contacten',c.id)}
    </div>`;}).join('') || '<div class="leeg">Niets gevonden.</div>';
}
$('qC').oninput = drawC;
const WEB = { 'univé':'www.unive.nl', 'unive':'www.unive.nl', 'agriver':'www.agriver.nl', 'scildon':'www.scildon.nl', 'centraal beheer':'www.centraalbeheer.nl', 'bovemij renault':'www.bovemij.nl', 'bovemij':'www.bovemij.nl' };
$('seedC').onclick = () => {
  const mijen = [...new Set([...D.bedrijf,...D.prive].map(x=>(x.mij||'').trim()).filter(m=>m && !['nee','ja'].includes(m.toLowerCase())))];
  const nieuw = mijen.filter(m=>!heeftContact(m));
  if(!nieuw.length){ toast('Alle maatschappijen staan er al'); return; }
  opslaan('contacten', items => items.concat(nieuw.map(m=>({ id:newId(), naam:m, org:m, rol:'Verzekeraar', web:WEB[m.toLowerCase()]||'' }))), nieuw.length+' toegevoegd');
};

// ---------- formulier ----------
const POLIS = [['nr','Nr'],['wat','Wat verzekerd','text',1],['cat','Categorie','list'],['mij','Maatschappij','list'],['polis','Polisnummer'],['verz','Verzekerd','jn'],['actie','Actie nodig','jn'],['premie','Premie per jaar (€)','num'],['opm','Opmerking'],['link','Link naar document (Drive)','url']];
const FIELDS = {
  bedrijf: POLIS, prive: POLIS,
  bez: [['loc','Locatie (bijv. 199, 207, 250)','list'],['afd','Afdeling','list'],['sub','Soort','list'],['obj','Object','text',1],['aantal','Aantal','num'],['eenh','Eenheid','list'],['prijs','Prijs per eenheid (€)','num'],['waarde','Waarde (€) – leeg laten = aantal × prijs','num'],['opm','Opmerking'],['link','Link naar document (Drive)','url']],
  priveNotes: [['tekst','Notitie','text',1],['link','Link (Drive)','url']],
  extra: [['tekst','Omschrijving','text',1],['link','Link','url',1]],
  contacten: [['naam','Naam (persoon of bedrijf)','text',1],['org','Maatschappij / bedrijf','list'],['rol','Rol (bijv. adviseur, schade melden)','list'],['tel','Telefoon'],['mob','Mobiel'],['email','E-mail','email'],['web','Website'],['login','Link klantportaal (inloggen)'],['adres','Adres'],['klantnr','Klantnummer / relatienummer'],['opm','Opmerking','area']],
  tijd: [['datum','Datum','date',1],['wie','Aanwezig'],['punten','Punten – één per regel. Extra info na een | (bijv: Olietanken opzeggen | KJ vraagt na)','area']],
};
const NAMEN = { bedrijf:'zakelijke polis', prive:'privé polis', bez:'object (kassen)', priveNotes:'notitie', extra:'link', tijd:'overleg', contacten:'contact' };

function openForm(sec, id, preset){
  const item = id ? D[sec].find(x=>x.id===id) : (preset || (sec==='prive'?{cat:'Privé'}:{}));
  if(!item) return;
  $('dlgTitel').textContent = (id?'Wijzig ':(sec==='bez'||sec==='contacten'?'Nieuw ':'Nieuwe ')) + NAMEN[sec];
  $('velden').innerHTML = FIELDS[sec].map(([k,l,t='text',req])=>{
    let v = item[k];
    if(k==='punten') v = (v||[]).map(p=>p.extra?`${p.tekst} | ${p.extra}`:p.tekst).join('\n');
    const r = req?' required':'';
    if(t==='jn') return `<label>${l}</label><select name="${k}"><option value="">–</option><option value="ja"${v==='ja'?' selected':''}>Ja</option><option value="nee"${v==='nee'?' selected':''}>Nee</option></select>`;
    if(t==='area') return `<label>${l}</label><textarea name="${k}">${esc(v)}</textarea>`;
    if(t==='list'){ const opts=[...new Set(D[sec].map(x=>x[k]).filter(Boolean))].sort(); return `<label>${l}</label><input name="${k}" list="dl_${k}" value="${esc(v)}"${r}><datalist id="dl_${k}">${opts.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`; }
    if(t==='num') return `<label>${l}</label><input name="${k}" inputmode="decimal" pattern="-?[0-9.]*[,.]?[0-9]*" value="${v==null?'':String(v).replace('.',',')}"${r}>`;
    return `<label>${l}</label><input name="${k}" type="${t}" value="${esc(v)}"${r}>`;
  }).join('');
  const dlg=$('dlg');
  dlg.onclose = async () => {
    if(dlg.returnValue!=='ok') return;
    const f = new FormData($('frm')), nieuw = { ...item, id: id || newId() };
    for(const [k,,t='text'] of FIELDS[sec]){
      let v = (f.get(k)||'').toString().trim();
      if(t==='num'){ v = v.replace(/\s/g,''); if(v.includes(',')) v = v.replace(/\./g,'').replace(',','.'); v = v==='' || isNaN(Number(v)) ? null : Number(v); }
      if(k==='punten') v = v.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const [a,...b]=x.split('|'); return {tekst:a.trim(), extra:b.join('|').trim()};});
      nieuw[k] = v;
    }
    if(sec==='bez' && (nieuw.waarde==null)) nieuw.waarde = (nieuw.aantal||0)*(nieuw.prijs||0);
    await opslaan(sec, items => { const i=items.findIndex(x=>x.id===nieuw.id); if(i>=0) items[i]=nieuw; else items.push(nieuw); return items; }, id?'Gewijzigd':'Toegevoegd');
  };
  dlg.returnValue=''; dlg.showModal();
}

async function opslaan(sec, wijzig, melding){
  try{
    const ref = doc(db,'overzicht',sec), metaRef = doc(db,'overzicht','meta');
    const items = await runTransaction(db, async tx => {
      const snap = await tx.get(ref);
      const nieuw = wijzig(withIds(snap.exists()?snap.data().items:[], sec));
      tx.set(ref, {items:nieuw});
      tx.set(metaRef, {gewijzigd:new Date().toISOString(), door:USER.email}, {merge:true});
      return nieuw;
    });
    D[sec] = items; D.meta = {...D.meta, gewijzigd:new Date().toISOString(), door:USER.email};
    render(); toast(melding+' ✔');
    if(sec==='bez' && INFO && $('dlgInfo').open){ INFO.items = D.bez.filter(INFO.filt); alleOpen(); renderInfo(); }
  }catch(e){
    alert(e.code==='permission-denied' ? 'Je mag niets wijzigen. Vraag de beheerder.' : 'Opslaan mislukt: '+e.message);
  }
}

document.addEventListener('click', e=>{
  const mj=e.target.closest('[data-mij]');
  if(mj){ $('qC').value=mj.dataset.mij; drawC(); document.querySelector('nav button[data-t="contact"]').click(); window.scrollTo(0,0); return; }
  const a=e.target.closest('[data-add]'); if(a){ openForm(a.dataset.add); return; }
  const ed=e.target.closest('[data-edit]'); if(ed){ openForm(ed.dataset.edit, ed.dataset.id); return; }
  const del=e.target.closest('[data-del]');
  if(del){
    const sec=del.dataset.del, id=del.dataset.id, x=D[sec].find(i=>i.id===id);
    const naam = x?.wat||x?.obj||x?.tekst||x?.datum||'';
    if(confirm(`Weet je zeker dat je "${naam}" wilt verwijderen?`))
      opslaan(sec, items=>items.filter(i=>i.id!==id), 'Verwijderd');
  }
});

$('editBtn').onclick = () => { EDIT=!EDIT; document.body.classList.toggle('edit',EDIT); $('editBtn').textContent = EDIT?'✔ Klaar':'✏️ Bewerken'; render(); };

$('expBtn').onclick = () => {
  const out = { bron:D.meta?.bron||'', gemaakt:D.meta?.gemaakt||'' }; KEYS.forEach(k=>out[k]=D[k]);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
  a.download=`verzekeringen-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
};

// ---------- inloggen ----------
$('in').onclick = () => signInWithPopup(auth, new GoogleAuthProvider())
  .catch(e => $('fout').textContent = 'Inloggen mislukt: ' + e.message);
$('uit').onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  USER = user; $('fout').textContent = '';
  if (!user) { $('login').hidden=false; $('app').hidden=true; $('user').hidden=true; $('in').hidden=false; return; }
  const beheer = beheerders.includes(user.email.toLowerCase());
  BEHEER = beheer; document.body.classList.toggle('beheer', beheer);
  $('user').hidden=false; $('uit').title='Ingelogd als '+user.email;
  ['editBtn','expBtn','upBtn'].forEach(i=>$(i).hidden=!beheer);
  try {
    const meta = await getDoc(doc(db,'overzicht','meta'));
    if (!meta.exists()) {
      $('loginTekst').textContent = 'Er staan nog geen gegevens in de database. Klik hieronder en kies je back-up of data.json.';
      $('in').hidden = true; $('loginTekst').after($('upBtn')); $('upBtn').className='btn blue'; return;
    }
    D = { meta: meta.data() };
    const docs = await Promise.all(KEYS.map(k => getDoc(doc(db,'overzicht',k))));
    docs.forEach((d,i) => D[KEYS[i]] = withIds(d.exists()?d.data().items:[], KEYS[i]));
    $('login').hidden=true; $('app').hidden=false;
    render();
  } catch (e) {
    $('login').hidden=false; $('app').hidden=true; $('in').hidden=true; $('loginTekst').textContent='';
    $('fout').textContent = e.code==='permission-denied'
      ? `Geen toegang voor ${user.email}. Vraag de beheerder om je toe te voegen.`
      : 'Fout bij laden: ' + e.message;
  }
});

$('upFile').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value=''; if (!f) return;
  if (D && !confirm('Let op: hiermee vervang je ALLE gegevens door dit bestand. Wijzigingen die je online hebt gedaan, gaan dan verloren. Doorgaan?')) return;
  try {
    const J = JSON.parse(await f.text());
    const b = writeBatch(db);
    b.set(doc(db,'overzicht','meta'), { bron:J.bron||f.name, gemaakt:J.gemaakt||new Date().toISOString().slice(0,10) });
    KEYS.forEach(k => b.set(doc(db,'overzicht',k), { items: withIds(J[k],k) }));
    await b.commit();
    alert('Gegevens geïmporteerd.'); location.reload();
  } catch (e) { alert('Importeren mislukt: ' + e.message); }
};
</script>
